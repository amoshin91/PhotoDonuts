<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf7f0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Store dashboard — Photo Donuts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23f4ecd9' stroke='%23e8b873' stroke-width='8'/><circle cx='50' cy='50' r='14' fill='white'/></svg>" />
</head>
<body class="dash-body">
  <a class="skip-link" href="#dashMain">Skip to settings</a>

  <!-- ============================ TOP BAR ============================ -->
  <header class="dash-header">
    <div class="dash-header__inner">
      <a class="brand brand--dash" href="index.html" aria-label="Photo Donuts storefront">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="28" height="28"><circle cx="20" cy="20" r="16" fill="#f4ecd9" stroke="#e8b873" stroke-width="5"/><circle cx="20" cy="20" r="5.5" fill="#fff"/><circle cx="13" cy="14" r="1.5" fill="#e83e8c"/><circle cx="27" cy="16" r="1.5" fill="#1971c2"/><circle cx="24" cy="27" r="1.5" fill="#ffd43b"/></svg>
        </span>
        <span class="brand__name">Photo <span class="brand__accent">Donuts</span></span>
      </a>
      <span class="dash-header__tag">Store dashboard</span>

      <div class="dash-header__right">
        <a class="dash-header__view" href="index.html" target="_blank" rel="noopener">
          View storefront
          <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </a>
        <div class="dash-user" id="dashUser"><!-- rendered by dashboard.js --></div>
      </div>
    </div>
  </header>

  <!-- Prototype disclosure — this dashboard has no server behind it yet. -->
  <p class="dash-proto" role="note">
    <strong>Prototype.</strong> Settings and accounts are saved in this browser only
    (localStorage) and roles are enforced in the UI, not on a server. Wire up the
    backend in <code>PROJECT_STATUS.md</code> before real staff use this.
  </p>

  <div class="dash-shell">
    <!-- ============================ SIDEBAR ============================ -->
    <aside class="dash-side" aria-label="Dashboard navigation">
      <div class="dash-side__group">
        <span class="dash-side__label" id="storePickerLabel">Store</span>
        <div id="storePicker"><!-- rendered by dashboard.js --></div>
      </div>
      <nav class="dash-nav" id="dashNav" aria-label="Settings sections"><!-- rendered by dashboard.js --></nav>
    </aside>

    <!-- ============================ MAIN ============================ -->
    <main class="dash-main" id="dashMain">
      <div id="dashContent"><!-- rendered by dashboard.js --></div>
    </main>
  </div>

  <!-- unsaved-changes bar, shown by dashboard.js when a form is dirty -->
  <div class="save-bar" id="saveBar" hidden>
    <span class="save-bar__text" id="saveBarText">You have unsaved changes.</span>
    <div class="save-bar__actions">
      <button class="btn btn--ghost" type="button" id="discardBtn">Discard</button>
      <button class="btn btn--primary" type="button" id="saveBtn">Save changes</button>
    </div>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script src="js/config.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/donut-svg.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/pickup.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
