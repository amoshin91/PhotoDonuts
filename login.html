<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf7f0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Staff sign-in — Photo Donuts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23f4ecd9' stroke='%23e8b873' stroke-width='8'/><circle cx='50' cy='50' r='14' fill='white'/></svg>" />
</head>
<body class="dash-body dash-body--auth">

  <main class="auth" aria-labelledby="authTitle">
    <div class="auth__card">
      <a class="brand auth__brand" href="index.html">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="30" height="30"><circle cx="20" cy="20" r="16" fill="#f4ecd9" stroke="#e8b873" stroke-width="5"/><circle cx="20" cy="20" r="5.5" fill="#fff"/><circle cx="13" cy="14" r="1.5" fill="#e83e8c"/><circle cx="27" cy="16" r="1.5" fill="#1971c2"/><circle cx="24" cy="27" r="1.5" fill="#ffd43b"/></svg>
        </span>
        <span class="brand__name">Photo <span class="brand__accent">Donuts</span></span>
      </a>

      <h1 id="authTitle" class="auth__title">Store dashboard</h1>
      <p class="auth__sub">Sign in to manage your store's menu, hours, pickup windows and pricing.</p>

      <form class="auth__form" id="loginForm" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input class="input input--full" id="email" type="email" autocomplete="username" placeholder="you@photodonuts.co" required />
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input class="input input--full" id="password" type="password" autocomplete="current-password" placeholder="Your password" required />
        </div>
        <p class="field-error" id="loginError" role="alert" hidden></p>
        <button class="btn btn--primary btn--block" type="submit" style="margin-top:1rem">Sign in</button>
      </form>

      <!-- Demo accounts. Delete this whole block once real auth is wired up. -->
      <div class="auth__demo">
        <p class="auth__demo-title">Demo accounts — one per role</p>
        <ul class="auth__demo-list" id="demoAccounts"></ul>
        <p class="auth__demo-note">
          Prototype only: accounts and settings live in this browser's
          localStorage, so they are per-device and are <strong>not</strong> a
          security boundary.
        </p>
      </div>

      <p class="auth__back"><a href="index.html">← Back to the storefront</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
